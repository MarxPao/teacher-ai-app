<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal do Professor - Login e Diário</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8fafc; color: #1e293b; }
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div id="login-container" class="card">
    <h2>Acesso ao Portal Escolar</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuário / E-mail</label>
        <input type="text" id="username" name="usuario" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="senha" autocomplete="current-password" />
      </div>
      <button type="submit" id="btn-login">Entrar no Portal</button>
    </form>
  </div>

  <div id="dashboard-container" class="card" style="display: none; max-width: 700px;">
    <h2>Diário de Classe — Turma 8A</h2>
    <table class="table-alunos">
      <thead>
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>202401</td>
          <td>Zeca Canário</td>
          <td>Ativo</td>
        </tr>
        <tr>
          <td>202402</td>
          <td>Beatriz Souza</td>
          <td>Ativo</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('dashboard-container').style.display = 'block';
    });
  </script>
</body>
</html>
