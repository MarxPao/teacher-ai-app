<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Portal com Tabela Virtualizada</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #virtual-container { height: 160px; overflow-y: scroll; border: 2px solid #94a3b8; position: relative; border-radius: 6px; }
    .virtual-spacer { height: 500px; position: relative; }
    table { width: 100%; border-collapse: collapse; position: absolute; top: 0; left: 0; }
    th, td { border: 1px solid #cbd5e1; padding: 6px 10px; text-align: left; background: white; }
    th { background: #f8fafc; }
  </style>
</head>
<body>
  <h1>Tabela Virtualizada (Janelamento de Linhas)</h1>
  <p>Role o container para visualizar os próximos discentes montados no DOM:</p>
  <div id="virtual-container">
    <div class="virtual-spacer" id="spacer">
      <table id="tabela-alunos">
        <thead>
          <tr><th>ID</th><th>Nome do Aluno</th><th>Nota</th></tr>
        </thead>
        <tbody id="tbody-virtual">
          <tr data-idx="0"><td>801</td><td>Tiago Ramos</td><td><input value="7.0"></td></tr>
          <tr data-idx="1"><td>802</td><td>Ursula Lima</td><td><input value="8.5"></td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>
    const container = document.getElementById('virtual-container');
    const tbody = document.getElementById('tbody-virtual');
    const table = document.getElementById('tabela-alunos');
    container.addEventListener('scroll', () => {
      const st = container.scrollTop;
      if (st > 80) {
        table.style.top = '100px';
        tbody.innerHTML = `
          <tr data-idx="2"><td>803</td><td>Valter Nunes</td><td><input value="9.0"></td></tr>
          <tr data-idx="3"><td>804</td><td>Yasmin Costa</td><td><input value="10.0"></td></tr>
        `;
      } else {
        table.style.top = '0px';
        tbody.innerHTML = `
          <tr data-idx="0"><td>801</td><td>Tiago Ramos</td><td><input value="7.0"></td></tr>
          <tr data-idx="1"><td>802</td><td>Ursula Lima</td><td><input value="8.5"></td></tr>
        `;
      }
    });
  </script>
</body>
</html>
