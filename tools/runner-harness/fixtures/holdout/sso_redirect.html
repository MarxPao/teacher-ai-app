<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Holdout - SSO Redirect</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .box { margin-top: 15px; padding: 15px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Portal Educacional com Login SSO</h1>
  <div id="login-box" class="box">
    <p>Acesso restrito ao corpo docente:</p>
    <button id="btn-sso" type="button" style="padding: 8px 16px; cursor: pointer;">Entrar com SSO</button>
  </div>
  <div id="painel-logado" class="box" style="display: none;">
    <h3>Diário de Classe Liberado</h3>
    <p>Aluno: Pedro Canário (1001)</p>
    <label for="nota_1001">Nota:</label>
    <input type="text" id="nota_1001" aria-label="Pedro Canário - Nota" value="">
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('auth') === 'success') {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('painel-logado').style.display = 'block';
    }
    document.getElementById('btn-sso').addEventListener('click', () => {
      window.location.href = 'http://localhost:8898/fixtures/holdout/sso_idp.html';
    });
  </script>
</body>
</html>
