<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Portal Paginado (Chamada)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
    th { background: #f1f5f9; }
    .pagination { margin-top: 15px; }
    .btn-proxima-pagina { padding: 6px 14px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-proxima-pagina:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Chamada Paginada</h1>
  <table id="paged-table">
    <thead>
      <tr><th>ID</th><th>Nome do Aluno</th><th>Nota</th></tr>
    </thead>
    <tbody id="page-content">
      <tr><td>1</td><td>Ana Silva</td><td><input value="10"></td></tr>
      <tr><td>2</td><td>Breno Castro</td><td><input value="8.0"></td></tr>
    </tbody>
  </table>
  <div class="pagination">
    <button class="btn-proxima-pagina" type="button" onclick="nextPage()">Próxima &gt;</button>
  </div>
  <script>
    let page = 1;
    function nextPage() {
      if (page === 1) {
        page = 2;
        document.getElementById('page-content').innerHTML = `
          <tr><td>3</td><td>Caio Moreira</td><td><input value="7.5"></td></tr>
          <tr><td>4</td><td>Dora Lins</td><td><input value="9.0"></td></tr>
        `;
        document.querySelector('.btn-proxima-pagina').disabled = true;
      }
    }
  </script>
</body>
</html>
