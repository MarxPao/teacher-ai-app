name: Security & Quality Audit

on:
  push:
    branches: [ main, master, 'refactor/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -- Gate 1: TypeScript + npm security + anti-mock + Vitest (unit only) ------
  node_gates:
    name: Node / TypeScript / Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      # C5: auditoria de deps -- falha em HIGH ou CRITICAL em producao
      - name: Package security audit (high + critical, prod only)
        run: npm audit --omit=dev --audit-level=high

      # A2: verificacao de que chave Gemini nao esta mais na URL
      - name: Verificar chave Gemini nao na URL (A2)
        run: |
          if grep -r "baseUrl.*key=" lib/explorer/ 2>/dev/null; then
            echo "FALHA: chave de API Gemini encontrada em URL -- use header x-goog-api-key (A2)"
            exit 1
          fi
          echo "OK: chave Gemini nao encontrada em URLs"

      - name: Zero-simulation / anti-mock audit
        run: node scripts/scan-mocks.mjs

      - name: SERVICE_ROLE_KEY leak check (Gap 2 security gate)
        run: bash scripts/ci-check-service-key.sh

      # C7/A11: sidecar aposentado -- garante que child_process nao foi re-introduzido
      - name: Verificar sidecar aposentado -- sem child_process na rota (C7)
        run: |
          if grep -E "^import.*child_process|execAsync|execSync" app/api/sidecar-task/route.ts 2>/dev/null; then
            echo "FALHA: child_process encontrado em sidecar-task/route.ts -- C7 regrediu!"
            exit 1
          fi
          echo "OK: sidecar-task/route.ts sem execucao de processos"

      # A13: CI gate -- CRON_SECRET obrigatorio em producao
      - name: Verificar hardening de CRON_SECRET nos endpoints (A13)
        run: |
          if grep -r "if (!cronSecret) return true" app/api/ 2>/dev/null; then
            echo "FALHA: bypass de autenticacao quando CRON_SECRET ausente -- A13 regrediu!"
            exit 1
          fi
          echo "OK: sem bypass de CRON_SECRET"

      - name: Vitest -- unit tests only
        run: |
          npx vitest run \
            --reporter=verbose \
            --testTimeout=30000 \
            --exclude '**/*.integration.*' \
            --exclude '**/*agenticBrowser*' \
            --exclude '**/*browserAutomation*' \
            --exclude '**/*extensionHost*' \
            --exclude '**/*livePortal*' \
            --exclude '**/*liveGraph*' \
            --exclude '**/*e2e*'

  # -- Gate 2: Python / pytest -- REMOVIDO (sidecar Python aposentado na Fase 6) -
  # O sidecar Python foi aposentado. Toda automacao de portais agora ocorre via
  # extensao TeacherAI v3.1 (nativeMessaging). Ver: sidecar/README.md (C7)
  #
  # python_gates: <- APOSENTADO

  # -- Gate 3: Next.js production build ----------------------------------------
  build_gate:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [ node_gates ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
