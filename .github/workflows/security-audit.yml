name: Security & Quality Audit

on:
  push:
    branches: [ main, master, 'refactor/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Gate 1: TypeScript + npm security + anti-mock + Vitest (unit only) ──────
  node_gates:
    name: Node / TypeScript / Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Package security audit (high + critical)
        run: npm audit --audit-level=high

      - name: Zero-simulation / anti-mock audit
        run: node scripts/scan-mocks.mjs

      - name: SERVICE_ROLE_KEY leak check (Gap 2 security gate)
        run: bash scripts/ci-check-service-key.sh

      - name: Vitest — unit tests only
        # Exclude browser-automation, integration, live-portal and E2E tests
        # that require a real Chrome / extension / network
        run: |
          npx vitest run \
            --reporter=verbose \
            --testTimeout=30000 \
            --exclude '**/*.integration.*' \
            --exclude '**/*agenticBrowser*' \
            --exclude '**/*browserAutomation*' \
            --exclude '**/*extensionHost*' \
            --exclude '**/*livePortal*' \
            --exclude '**/*liveGraph*' \
            --exclude '**/*e2e*'

  # ── Gate 2: Python / pytest — sidecar unit tests ────────────────────────────
  python_gates:
    name: Python / pytest (sidecar)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements.txt

      - name: Install Python dependencies
        run: pip install -r sidecar/requirements.txt

      - name: pytest — sidecar unit tests
        # Exclude E2E / browser-harness files that need a live Chrome session
        run: |
          pytest sidecar/tests/ \
            --ignore=sidecar/e2e_autonomous_validation.py \
            --ignore=sidecar/e2e_listener_pipeline_test.py \
            --ignore=sidecar/browser_harness_runner.py \
            --ignore=sidecar/tests/test_e2e_real_legacy_portal.py \
            --ignore=sidecar/tests/test_e2e_real_sandbox_portal.py \
            --ignore=sidecar/tests/test_live_learning_flow.py \
            --ignore=sidecar/tests/test_live_learning_success_e2e.py \
            --ignore=sidecar/tests/test_ppav_loop_real_e2e.py \
            --ignore=sidecar/tests/test_side_panel_approval_card_e2e.py \
            --ignore=sidecar/tests/test_side_panel_consolidated_ux.py \
            --ignore=sidecar/tests/test_read_roster_sandbox.py \
            -x \
            -v \
            --tb=short

  # ── Gate 3: Next.js production build ────────────────────────────────────────
  build_gate:
    name: Next.js Build
    runs-on: ubuntu-latest
    # Run build only after type-check and tests pass to save CI minutes
    needs: [ node_gates ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Next.js production build
        run: npm run build
        env:
          # Silence telemetry noise in CI logs
          NEXT_TELEMETRY_DISABLED: '1'
