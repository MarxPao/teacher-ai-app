name: Security & Quality Audit

on:
  push:
    branches: [ main, master, 'refactor/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Package Security Audit (Critical/High)
        run: npm audit --audit-level=high

      - name: Run Zero-Simulation Anti-Mock Audit
        run: node scripts/scan-mocks.mjs

      - name: Run Vitest Suite
        run: npx vitest run

      - name: Run Next.js Build
        run: npm run build
