<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEACHER??? – Agente</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      min-height: 420px;
      background: #002b36;
      font-family: 'Outfit', sans-serif;
      color: #fdf6e3;
      display: flex;
      flex-direction: column;
    }

    /* ——— Header ——— */
    .header {
      background: linear-gradient(135deg, #073642 0%, #002b36 100%);
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(42,161,152,0.2);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-pill {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #b58900, #cb4b16);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-title { font-size: 15px; font-weight: 700; color: #fdf6e3; }
    .header-sub   { font-size: 10px; color: #93a1a1; margin-top: 1px; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #586e75;
      box-shadow: none;
      margin-left: auto;
      transition: all 0.4s;
    }
    .status-dot.active {
      background: #859900;
      box-shadow: 0 0 8px #859900;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px #859900; }
      50%       { box-shadow: 0 0 14px #859900; }
    }

    /* ——— Platform indicator ——— */
    .platform-banner {
      background: rgba(42,161,152,0.1);
      border: 1px solid rgba(42,161,152,0.2);
      margin: 12px 16px 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: #2aa198;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .platform-banner.inactive {
      background: rgba(88,110,117,0.1);
      border-color: rgba(88,110,117,0.2);
      color: #586e75;
    }

    /* ——— Action list ——— */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: #586e75;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 14px 16px 6px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 16px 8px;
      padding: 11px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      color: #fdf6e3;
      font-size: 13px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
    }

    .action-btn:hover {
      background: rgba(42,161,152,0.12);
      border-color: rgba(42,161,152,0.3);
      transform: translateX(2px);
    }

    .action-btn .icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .action-btn .text { flex: 1; }
    .action-btn .desc { font-size: 10px; color: #586e75; font-weight: 400; margin-top: 2px; }
    .action-btn .arrow { font-size: 10px; color: #586e75; }

    /* ——— Activity Log ——— */
    .log-area {
      flex: 1;
      margin: 0 16px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 12px;
      overflow-y: auto;
      max-height: 110px;
    }

    .log-entry {
      font-size: 10.5px;
      color: #586e75;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .log-entry:last-child { border-bottom: none; }
    .log-entry .ts { color: #2aa198; font-weight: 700; margin-right: 6px; }
    .log-entry.ok  { color: #859900; }
    .log-entry.err { color: #dc322f; }

    /* ——— Footer ——— */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 9px;
      color: #586e75;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="logo-pill">🧑‍🏫</div>
      <div>
        <div class="header-title">TEACHER??? Agente</div>
        <div class="header-sub">Extensão Agêntica para Portais Escolares</div>
      </div>
      <div class="status-dot" id="statusDot"></div>
    </div>
  </div>

  <!-- Platform Banner -->
  <div class="platform-banner inactive" id="platformBanner">
    <span>🌐</span>
    <span id="platformName">Nenhum portal escolar detectado</span>
  </div>

  <!-- Quick Actions -->
  <div class="section-label">Ações Rápidas</div>

  <button class="action-btn" id="btnOpenApp">
    <div class="icon" style="background: rgba(181,137,0,0.15); color: #b58900;">🏠</div>
    <div class="text">
      <div>Abrir Painel TEACHER???</div>
      <div class="desc">Acesse o app principal e gerencie tarefas</div>
    </div>
    <span class="arrow">›</span>
  </button>

  <button class="action-btn" id="btnScanPage">
    <div class="icon" style="background: rgba(42,161,152,0.15); color: #2aa198;">🔍</div>
    <div class="text">
      <div>Escanear Página Atual</div>
      <div class="desc">Identificar campos de formulário disponíveis</div>
    </div>
    <span class="arrow">›</span>
  </button>

  <button class="action-btn" id="btnLastTask">
    <div class="icon" style="background: rgba(108,113,196,0.15); color: #6c71c4;">⚡</div>
    <div class="text">
      <div>Preencher com Última Tarefa</div>
      <div class="desc">Reutilizar dados da última ação enviada</div>
    </div>
    <span class="arrow">›</span>
  </button>

  <!-- Activity Log -->
  <div class="section-label">Log de Atividade</div>
  <div class="log-area" id="logArea">
    <div class="log-entry"><span class="ts">--:--</span>Aguardando conexão com TEACHER???...</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    v1.2 • Machado Sobrinho • Santa Catarina • Plural • Cambridge One • Teams
  </div>

  <script src="popup.js"></script>
</body>
</html>
