<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher AI — Status do Assistente</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: #0f172a;
      font-family: 'Outfit', sans-serif;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #b58900, #cb4b16);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }

    .version-tag {
      font-size: 10px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Main Status Card */
    .status-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .status-indicator {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .status-indicator.ready {
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
      animation: pulseGreen 2s infinite;
    }

    .status-indicator.needs_login,
    .status-indicator.unrecognized_portal {
      background: rgba(245, 158, 11, 0.15);
      border: 2px solid #f59e0b;
      color: #f59e0b;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.3);
      animation: pulseYellow 2s infinite;
    }

    .status-indicator.connecting {
      background: rgba(59, 130, 246, 0.15);
      border: 2px solid #3b82f6;
      color: #3b82f6;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
      animation: pulseBlue 1.5s infinite;
    }

    .status-indicator.offline {
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid #ef4444;
      color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }

    @keyframes pulseBlue {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(59, 130, 246, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
    }

    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
    }

    @keyframes pulseYellow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(245, 158, 11, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    }

    .status-title {
      font-size: 15px;
      font-weight: 700;
    }

    .status-desc {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.45;
    }

    /* Context Details */
    .details-box {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      color: #94a3b8;
    }

    .detail-val {
      font-weight: 600;
      color: #f8fafc;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Action Buttons */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🦉</div>
      <span class="brand-title">Teacher AI</span>
    </div>
    <span class="version-tag">Extensão v3.1</span>
  </div>

  <div class="status-card">
    <div id="statusIndicator" class="status-indicator offline">
      <span id="statusIcon">✕</span>
    </div>
    <div id="statusTitle" class="status-title">Verificando...</div>
    <div id="statusDesc" class="status-desc">Consultando o assistente Teacher AI...</div>
  </div>

  <div class="details-box">
    <div class="detail-row">
      <span class="detail-label">Portal Escolar:</span>
      <span id="detailPortal" class="detail-val">—</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Página Atual:</span>
      <span id="detailPage" class="detail-val">—</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Sessão:</span>
      <span id="detailAuth" class="detail-val">—</span>
    </div>
  </div>

  <div class="buttons">
    <button id="btnOpenChat" class="btn btn-primary">💬 Abrir Assistente no Portal</button>
    <button id="btnReconnect" class="btn btn-secondary">🔄 Atualizar Conexão</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
